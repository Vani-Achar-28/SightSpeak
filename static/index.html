<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SightSpeak</title>
<style>
  :root { --bg:#0b0f17; --fg:#ffffff; --accent:#ffd400; --card:#161c28; --ok:#3ddc84; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,Segoe UI,Roboto,sans-serif;
         display:flex; flex-direction:column; min-height:100vh; }
  header { padding:14px 16px; font-size:1.4rem; font-weight:700; }
  video { width:100%; max-height:42vh; object-fit:cover; background:#000; }
  .controls { padding:12px 16px; display:flex; gap:10px; align-items:center; }
  select { flex:1; font-size:1.1rem; padding:12px; border-radius:10px; background:var(--card); color:var(--fg); border:2px solid #333; }
  #scan { margin:8px 16px; padding:28px; font-size:2rem; font-weight:800; border:none; border-radius:18px;
          background:var(--accent); color:#000; cursor:pointer; }
  #scan:disabled { opacity:.6; }
  .row { display:flex; gap:10px; margin:0 16px 8px; }
  .row button { flex:1; padding:18px; font-size:1.2rem; font-weight:700; border-radius:14px; border:2px solid #444;
                background:var(--card); color:var(--fg); cursor:pointer; }
  #status { margin:4px 16px; font-size:1.05rem; display:flex; align-items:center; gap:8px; color:#bbb; }
  .dot { width:14px; height:14px; border-radius:50%; background:#666; flex:none; }
  .dot.on { background:var(--ok); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  #voiceInfo { margin:0 16px; font-size:.95rem; color:#8a93a6; }
  #result { margin:8px 16px 24px; padding:16px; background:var(--card); border-radius:14px; font-size:1.3rem; line-height:1.5; min-height:80px; }
  #start { position:fixed; inset:0; z-index:10; border:none; background:var(--accent); color:#000;
           font-size:2.4rem; font-weight:900; padding:24px; cursor:pointer; }
  #start small { display:block; font-size:1.2rem; font-weight:600; margin-top:12px; }
  button:focus-visible, select:focus-visible { outline:4px solid #4da3ff; }
</style>
</head>
<body>
  <button id="start" aria-label="Tap anywhere to start SightSpeak">
    SightSpeak 👁️<br>TAP ANYWHERE TO START
    <small>Then say "scan", "repeat" or "help"</small>
  </button>

  <header>SightSpeak 👁️</header>
  <video id="video" autoplay playsinline muted aria-label="Camera preview"></video>

  <div class="controls">
    <label for="lang" style="font-size:1.1rem">Language</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="kn">Kannada</option>
      <option value="ta">Tamil</option>
      <option value="te">Telugu</option>
      <option value="mr">Marathi</option>
      <option value="bn">Bengali</option>
    </select>
  </div>

  <button id="scan" aria-label="Scan what is in front of me">SCAN</button>
  <div class="row">
    <button id="repeat" aria-label="Repeat last answer">REPEAT</button>
    <button id="help" aria-label="Hear the voice commands">HELP</button>
  </div>

  <div id="status" role="status"><span class="dot" id="dot"></span><span id="statusText">Tap the screen to start.</span></div>
  <div id="voiceInfo"></div>
  <div id="result" role="status" aria-live="polite">Say "scan" or press SCAN.</div>
  <canvas id="canvas" hidden></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const scanBtn = document.getElementById("scan");
const result = document.getElementById("result");
const langSel = document.getElementById("lang");
const statusText = document.getElementById("statusText");
const voiceInfo = document.getElementById("voiceInfo");
const dot = document.getElementById("dot");

// Backup English phrases in case the server cannot be reached
const FALLBACK = {
  server: "I could not reach the server.",
  camera: "The camera is not available. Please allow camera access.",
  mic: "The microphone is blocked. Please allow microphone access, or use the buttons.",
  unknown: "Sorry, I did not understand. Say help to hear the commands.",
  nothing: "There is nothing to repeat yet.",
  changed: "Language changed.",
  scanning: "Scanning."
};
const phraseCache = {};

// Words the browser may hear when you say a language name
const ALIASES = {
  hi: ["hindi", "hindu", "indie", "indi", "handy", "hendi", "हिंदी", "हिन्दी"],
  kn: ["kannada", "canada", "kanada", "kannad", "kanara", "ಕನ್ನಡ"],
  ta: ["tamil", "thamil", "tammy", "தமிழ்"],
  te: ["telugu", "telegu", "telugo", "తెలుగు"],
  mr: ["marathi", "marati", "maratha", "मराठी"],
  bn: ["bengali", "bangla", "bengal", "bangali", "বাংলা"],
  en: ["english", "inglish"]
};

// Sound-alikes for "scan" (Chrome often hears these instead)
const SCAN_WORDS = ["scan", "scam", "scand", "scanned", "scanner", "scanning", "skin", "skan", "can", "scant", "san", "scarn", "sgan"];
const SCAN_PHRASES = ["in front", "around me", "what do you see", "what is this", "what's this", "look"];

let recog = null, active = false, speaking = false, busy = false;
let lastGroups = null, speakId = 0, lastFire = 0;

function setStatus(t) { statusText.textContent = t; }
function setResult(t) { result.textContent = t; }

/* ---------- Phrases from the server (offline) ---------- */
async function loadPhrases(lang) {
  if (phraseCache[lang]) return phraseCache[lang];
  try {
    const res = await fetch("/api/phrases?lang=" + lang);
    const data = await res.json();
    phraseCache[lang] = data;
    return data;
  } catch (e) { return FALLBACK; }
}
async function t(key) {
  const p = await loadPhrases(langSel.value);
  return p[key] || FALLBACK[key] || key;
}

/* ---------- Voices ---------- */
function getVoicesAsync() {
  return new Promise(resolve => {
    const v = window.speechSynthesis.getVoices();
    if (v.length) { resolve(v); return; }
    const done = () => resolve(window.speechSynthesis.getVoices());
    window.speechSynthesis.onvoiceschanged = done;
    setTimeout(done, 1200);
  });
}

async function pickVoice(code) {
  const voices = await getVoicesAsync();
  const norm = v => v.lang.toLowerCase().replace("_", "-");
  let list = [];
  if (code === "en") {
    list = voices.filter(v => norm(v).startsWith("en-in"));
    if (!list.length) list = voices.filter(v => norm(v).startsWith("en"));
  } else {
    list = voices.filter(v => norm(v).startsWith(code));
  }
  return list.find(v => /google|natural|online/i.test(v.name)) || list[0] || null;
}

async function showVoice() {
  const code = langSel.value;
  const name = langSel.selectedOptions[0].textContent;
  const v = await pickVoice(code);
  if (v) voiceInfo.textContent = "Voice: " + v.name;
  else if (code === "en") voiceInfo.textContent = "No English voice found in this browser.";
  else voiceInfo.textContent = "Using SightSpeak's built-in " + name + " voice (downloads once, then works offline).";
  return v;
}

/* Built-in voice (played from the server) */
const audioEl = new Audio();
let audioDone = null;

function stopAudio() {
  try { audioEl.pause(); } catch (e) {}
  if (audioDone) { const d = audioDone; audioDone = null; d(); }
}

async function serverSpeak(text, code, id) {
  const form = new FormData();
  form.append("text", text);
  form.append("lang", code);
  const res = await fetch("/api/tts", { method: "POST", body: form });
  if (!res.ok) throw new Error("tts " + res.status);
  const blob = await res.blob();
  if (id !== speakId) return;
  const url = URL.createObjectURL(blob);
  audioEl.src = url;
  await new Promise(resolve => {
    audioDone = resolve;
    audioEl.onended = resolve;
    audioEl.onerror = resolve;
    audioEl.play().catch(resolve);
  });
  URL.revokeObjectURL(url);
}

function speak(text, code, browserOnly) {
  code = code || langSel.value;
  return new Promise(async resolve => {
    const id = ++speakId;
    window.speechSynthesis.cancel();
    stopAudio();
    const voice = await pickVoice(code);
    if (id !== speakId) { resolve(); return; }
    if (!voice && code !== "en" && browserOnly) { resolve(); return; }

    speaking = true;
    stopListening();
    const finish = () => {
      if (id !== speakId) { resolve(); return; }
      speaking = false;
      setTimeout(startListening, 300);
      resolve();
    };

    // No browser voice for this language: use the built-in voice from the server
    if (!voice && code !== "en") {
      try {
        setStatus("Preparing voice... (the first time can take a few minutes)");
        await serverSpeak(text, code, id);
        finish();
        return;
      } catch (e) {
        voiceInfo.textContent = "The built-in voice is not ready yet. Check the server window.";
        if (id !== speakId) { resolve(); return; }
      }
    }

    const u = new SpeechSynthesisUtterance(text);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    else { u.lang = code === "en" ? "en-IN" : code + "-IN"; }
    u.rate = 0.95;
    u.onend = finish;
    u.onerror = finish;
    setTimeout(finish, text.length * 100 + 4000);   // safety net
    window.speechSynthesis.speak(u);
  });
}

async function say(key) {
  const text = await t(key);
  setResult(text);
  await speak(text);
}

/* ---------- Listening ---------- */
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus("Voice commands need Chrome. Use the buttons."); return; }
  recog = new SR();
  recog.lang = "en-IN";            // commands are spoken in English
  recog.continuous = true;
  recog.interimResults = true;
  recog.maxAlternatives = 5;

  recog.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      const alts = [];
      for (let j = 0; j < res.length; j++) alts.push(res[j].transcript.toLowerCase().trim());
      setStatus('Heard: "' + alts[0] + '"');
      if (tryCommand(alts)) return;
      if (res.isFinal && alts[0].split(" ").length >= 2 && !busy) { say("unknown"); return; }
    }
  };
  recog.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      active = false; dot.classList.remove("on");
      setStatus("Microphone blocked. Use the buttons."); say("mic");
    }
  };
  recog.onend = () => { dot.classList.remove("on"); if (active && !speaking) setTimeout(startListening, 200); };

  setInterval(() => {
    if (active && !speaking && !busy && !dot.classList.contains("on")) startListening();
  }, 2500);
}

function startListening() {
  if (!recog || !active || speaking) return;
  try {
    recog.start();
    dot.classList.add("on");
    setStatus('Listening... say "scan", "repeat" or "help"');
  } catch (e) { dot.classList.add("on"); }
}
function stopListening() {
  if (!recog) return;
  try { recog.abort(); } catch (e) {}
  dot.classList.remove("on");
}

/* ---------- Commands ---------- */
function matchCommand(s) {
  const words = s.split(/\s+/);
  for (const code in ALIASES) {
    if (ALIASES[code].some(a => s.includes(a))) return { type: "lang", code };
  }
  if (s.includes("repeat") || s.includes("say again") || s === "again") return { type: "repeat" };
  if (s.includes("help") || s.includes("command")) return { type: "help" };
  if (s.includes("stop") || s.includes("quiet") || s.includes("silence") || s.includes("cancel")) return { type: "stop" };
  if (SCAN_PHRASES.some(p => s.includes(p))) return { type: "scan" };
  if (words.length <= 3 && words.some(w => SCAN_WORDS.includes(w))) return { type: "scan" };
  return null;
}

function tryCommand(alts) {
  if (busy || Date.now() - lastFire < 2500) return false;
  for (const s of alts) {
    const cmd = matchCommand(s);
    if (cmd) { lastFire = Date.now(); runCommand(cmd); return true; }
  }
  return false;
}

function runCommand(cmd) {
  if (cmd.type === "lang") changeLanguage(cmd.code);
  else if (cmd.type === "scan") scan();
  else if (cmd.type === "repeat") repeat();
  else if (cmd.type === "help") say("help");
  else if (cmd.type === "stop") {
    speakId++;
    window.speechSynthesis.cancel(); stopAudio();
    speaking = false; setTimeout(startListening, 200);
  }
}

async function changeLanguage(code) {
  langSel.value = code;
  const name = langSel.selectedOptions[0].textContent;
  setStatus("Language: " + name);
  await loadPhrases(code);
  await showVoice();
  if (lastGroups !== null) await repeat();   // say the last answer in the new language
  else await say("changed");
}

/* ---------- Describe the last scan in the current language ---------- */
async function describe(groups) {
  const form = new FormData();
  form.append("groups", JSON.stringify(groups));
  form.append("lang", langSel.value);
  const res = await fetch("/api/describe", { method: "POST", body: form });
  return await res.json();
}

async function announce(data) {
  setResult(data.spoken);
  let code = langSel.value;
  if (data.translated === false) {
    code = "en";
    voiceInfo.textContent = "Online translation is unavailable right now, so this answer is in English.";
  }
  await speak(data.spoken, code);
}

async function repeat() {
  if (lastGroups === null) { say("nothing"); return; }
  try {
    const data = await describe(lastGroups);
    await announce(data);
  } catch (e) { await say("server"); }
}

/* ---------- Camera + scan ---------- */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    video.srcObject = stream;
    return true;
  } catch (e) { return false; }
}

async function scan() {
  if (busy) return;
  if (!video.videoWidth) { say("camera"); return; }
  busy = true;
  scanBtn.disabled = true;
  setResult("Scanning...");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85));
  t("scanning").then(txt => speak(txt, undefined, true));   // quick "Scanning." only if the browser has a voice

  const form = new FormData();
  form.append("file", blob, "frame.jpg");
  form.append("lang", langSel.value);
  form.append("conf", "0.25");

  try {
    const res = await fetch("/api/detect", { method: "POST", body: form });
    const data = await res.json();
    lastGroups = data.groups;
    await announce(data);
  } catch (e) {
    await say("server");
  }
  busy = false;
  scanBtn.disabled = false;
}

/* ---------- Start (browsers need one tap before mic and audio work) ---------- */
document.getElementById("start").addEventListener("click", async () => {
  document.getElementById("start").style.display = "none";
  // unlock audio playback inside this tap
  audioEl.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  audioEl.play().catch(() => {});
  const ok = await startCamera();
  initRecognition();
  active = true;
  await loadPhrases(langSel.value);
  await showVoice();
  if (!ok) { await say("camera"); }
  const welcome = await t("welcome");
  setResult(welcome);
  await speak(welcome);
});

scanBtn.addEventListener("click", scan);
document.getElementById("repeat").addEventListener("click", repeat);
document.getElementById("help").addEventListener("click", () => say("help"));
langSel.addEventListener("change", () => changeLanguage(langSel.value));
</script>
</body>
</html>
